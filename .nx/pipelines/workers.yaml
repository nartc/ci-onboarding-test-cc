# Worker setups for the Nx Cloud CI lab. Imported by ci.yaml.
# Nx Cloud needs at least 3 workers to distribute.

# Used by the main job. Sized by the work left after cache hits. A run with no stored
# timings yet always picks large: 16 workers plus the main-job worker. Every count names
# lab-medium, lab-large and lab-small, because the assignment rules send tasks to each.
pr:
  small:
    count: 3 lab-medium; 1 lab-large; 1 lab-small
    workload: 20%
  medium:
    count: 6 lab-medium; 2 lab-large; 1 lab-small
    workload: 55%
  large: 10 lab-medium; 4 lab-large; 2 lab-small
  main-job-worker:
    cpu: 2
    memory: 4GB
  # One target from each Nx command in the main job.
  stop-after:
    - env-check
    - test
  # Flaky tests fail now and then. Keep going, to see more of the run.
  fail-after: 5
  assignment-rules:
    # Secrets reach a lab-small worker through the launch-template env as well.
    - targets:
        - env-check
        - secret-echo
      run-on:
        - agent: lab-small
    # Memory-heavy tests need the large machines.
    - projects:
        - '@ci/*-mem-*'
      targets:
        - test
      run-on:
        - agent: lab-large
    - projects:
        - '@ci/*-cpu-*'
      targets:
        - test
      run-on:
        - agent: lab-large
        - agent: lab-medium
    # `?` matches one character: the two-digit slow modules.
    - projects:
        - '@ci/*-slow-??'
      targets:
        - build
        - typecheck
      run-on:
        - agent: lab-large
    # Comma-joined globs must all match: slow modules outside finance.
    - projects:
        - '@ci/*-slow-*,!@ci/finance-*'
      targets:
        - codegen
      run-on:
        - agent: lab-small
    # The roots of the graph run on the main job's own machine, and so do the finance slow
    # modules' tasks that no narrower rule claims (their codegen and test).
    - projects:
        - '@ci/types'
        - '@ci/constants'
        - '@ci/utils'
        - '@ci/finance-slow-*'
      run-on:
        - agent: main
    # Apps sit at the top of the graph and import the most code.
    - projects:
        - '@ci/api'
        - '@ci/worker'
        - '@ci/scheduler'
        - '@ci/web'
        - '@ci/admin'
        - '@ci/cli'
        - '@ci/gateway'
      targets:
        - build
        - typecheck
      run-on:
        - agent: lab-large
  scheduling-constraints:
    # Pretend the api and the background apps share a test database.
    - projects:
        - '@ci/api'
      targets:
        - test
      cannot-run-with:
        - projects:
            - '@ci/worker'
            - '@ci/scheduler'
          targets:
            - test
    # Never two memory-heavy tests on one worker, and no CPU-heavy test next to one.
    - projects:
        - '@ci/*-mem-*'
      targets:
        - test
      cannot-run-with:
        - projects:
            - '@ci/*-mem-*'
            - '@ci/*-cpu-*'
          targets:
            - test

# Used by the e2e job: a fixed count, no main-job worker, never stops on failures. The e2e
# suites depend on continuous serve tasks, which run on the same worker.
e2e:
  workers: 3 lab-large
  main-job-worker: false
  stop-after:
    - e2e
  fail-after: 0
  assignment-rules:
    - targets:
        - e2e
        - serve
      run-on:
        - agent: lab-large
  scheduling-constraints:
    - targets:
        - e2e
      cannot-run-with:
        - targets:
            - e2e

# Used by the gateway-smoke job: a count string on its own.
smoke: 3 lab-small
