# yaml-language-server: $schema=https://cloud.nx.app/nx-cloud/static/schemas/workflow.schema.json
#
# Nx Cloud CI lab pipeline. It uses as much of the pipeline schema as it can on purpose:
# imported sections, custom launch templates in three sizes, sized, fixed, bare and inline
# workers, assignment rules, scheduling constraints, a custom step template, job needs and
# conditions, expressions, step outputs, and stored secrets and variables.
#
# Stored variables (Nx Cloud workspace settings > Environment variables):
#   CI_LAB_SECRET        secret    checked by @ci/config:env-check against a SHA-256
#   CI_LAB_VAR           variable  must be "nx-cloud-ci-lab"
#   CI_LAB_FLAKE_RATE    variable  optional, chance that a flaky test fails (default 0.05)
#   CI_LAB_CPU_SECONDS   variable  optional, how long CPU-heavy tests run (default 5)
#   CI_LAB_MEM_MB        variable  optional, how much memory-heavy tests hold (default 2048)
name: CI

on:
  pull-requests:
    event: PR
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore: ['**/*.md']
  main-pushes:
    event: PUSH
    branches: [main]
    paths-ignore: ['**/*.md']
  version-tags:
    event: PUSH
    tags: ['v*']

launch-templates: .nx/pipelines/launch-templates.yaml
worker-templates: .nx/pipelines/workers.yaml
ultracache: .nx/pipelines/ultracache.yaml

self-healing:
  fix-tasks-patterns: ['*lint*', '*typecheck*', '*test*', '!*e2e*']
  auto-apply-patterns: ['*lint*']

# Reaches every job and its workers.
env:
  CI_LAB_REQUIRE_SECRETS: 'true'
  CI_LAB_SECRET: ${{ secrets.CI_LAB_SECRET }}
  CI_LAB_VAR: ${{ vars.CI_LAB_VAR || 'unset' }}
  CI_LAB_FLAKE_RATE: ${{ vars.CI_LAB_FLAKE_RATE || '0.05' }}
  CI_LAB_CPU_SECONDS: ${{ vars.CI_LAB_CPU_SECONDS || '5' }}
  CI_LAB_MEM_MB: ${{ vars.CI_LAB_MEM_MB || '2048' }}
  CI_LAB_SLOW_SECONDS: '3'
  CI_LAB_LOCK_HASH: ${{ hashFiles('pnpm-lock.yaml') }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: lab-utility
    # Sized workers written inline. Bare counts reuse the job's own machine setup.
    workers:
      small: 3
      medium: 4
      large: 6
      main-job-worker: false
      stop-after: [lint]
      fail-after: 0
    timeout-minutes: 20
    steps:
      - name: Lint affected projects
        run: npx nx affected -t lint

  main:
    name: Typecheck, build, test
    runs-on: lab-medium
    workers: pr
    timeout-minutes: 40
    env:
      CI_LAB_JOB: main
    steps:
      - name: Put node_modules/.bin on PATH
        run: echo "$NX_CLOUD_REPOSITORY_DIR/node_modules/.bin" >> "$NX_CLOUD_PATH"

      - name: Describe the run
        id: describe
        run: |
          count=$(nx show projects --affected --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).length')
          echo "affected=$count" >> "$NX_CLOUD_OUTPUT"
          echo "CI_LAB_AFFECTED=$count" >> "$NX_CLOUD_ENV"
          echo "${{ format('{0} of {1} at {2}', nxcloud.event_name, nxcloud.ref_name, nxcloud.sha) }}: $count affected projects" >> "$NX_CLOUD_STEP_SUMMARY"
          echo "lockfile hash: $CI_LAB_LOCK_HASH"

      # Redaction check, part 1: a job step prints the secret. @ci/config:secret-echo does the
      # same inside a task on a worker.
      - name: Print the lab secret from a step
        shell: sh
        timeout-minutes: 2
        env:
          STEP_SECRET: ${{ secrets.CI_LAB_SECRET }}
        run: |
          echo "1. exact value:   $STEP_SECRET"
          echo "2. inside a word: before${STEP_SECRET}after"
          echo "3. base64:        $(printf '%s' "$STEP_SECRET" | base64)"
          echo "4. first half:    $(printf '%s' "$STEP_SECRET" | cut -c1-22)"
          echo "5. from env:      $CI_LAB_SECRET"

      - name: Check that stored variables reach a worker, and print the secret from a task
        id: env
        continue-on-error: true
        run: nx run-many -t env-check secret-echo -p @ci/config

      - name: Typecheck, build and test ${{ steps.describe.outputs.affected }} affected projects
        run: nx affected -t typecheck build test

      - name: Explain a failed env-check
        if: steps.env.outcome == 'failure'
        run: |
          echo "env-check failed. Set CI_LAB_SECRET (secret) and CI_LAB_VAR (variable) in the Nx Cloud workspace settings." | tee -a "$NX_CLOUD_STEP_SUMMARY"
          exit 1

  e2e:
    name: E2E suites
    needs: main
    runs-on: lab-large
    workers: e2e
    timeout-minutes: 20
    steps:
      - name: Run affected e2e suites (each with its continuous serve task)
        run: npx nx affected -t e2e

  gateway-smoke:
    name: Gateway from the remote cache
    needs: main
    if: needs.main.result == 'success'
    runs-on: lab-medium
    workers: smoke
    timeout-minutes: 15
    steps:
      - name: Build the gateway and everything under it (remote cache hits)
        run: npx nx run @ci/gateway:build
      - name: Ask the built gateway for its depth
        id: gateway
        working-directory: apps/gateway
        run: |
          depth=$(node --input-type=module -e "import('./dist/app.js').then((m) => console.log(m.handle('GET', '/depth').body.depth))")
          echo "depth=$depth" >> "$NX_CLOUD_OUTPUT"
      - name: Check the gateway depth
        if: steps.gateway.outputs.depth != '34'
        run: |
          echo "Expected @ci/gateway at depth 34, got ${{ steps.gateway.outputs.depth }}"
          exit 1

  cli-smoke:
    name: CLI from the remote cache
    needs: main
    if: needs.main.result == 'success'
    # A job machine defined inline instead of through runs-on.
    resource-class: docker_linux_amd64/medium
    image: ubuntu22.04-node24.14-v1
    init-steps:
      - name: Checkout
        uses: nrwl/nx-cloud-workflows/v6/workflow-steps/checkout/main.yaml
      - name: Install Node from .nvmrc
        uses: nrwl/nx-cloud-workflows/v6/workflow-steps/install-node/main.yaml
      - name: Install node modules
        uses: nrwl/nx-cloud-workflows/v6/workflow-steps/install-node-modules/main.yaml
    workers: false
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - name: Build the CLI (remote cache hits from the main job)
        run: npx nx run @ci/cli:build
      - name: Run the CLI
        id: cli
        run: |
          echo "depth=$(node dist/main.js depth)" >> "$NX_CLOUD_OUTPUT"
          node dist/main.js graph | head -n 20
      - name: Check the graph depth
        if: steps.cli.outputs.depth != '10'
        run: |
          echo "Expected @ci/cli at depth 10, got ${{ steps.cli.outputs.depth }}"
          exit 1

  report:
    name: Report
    needs: [lint, main, e2e, gateway-smoke, cli-smoke]
    if: always()
    resource-class: docker_linux_amd64/medium
    image: ubuntu22.04-node24.14-v1
    init-steps:
      - name: Checkout
        uses: nrwl/nx-cloud-workflows/v6/workflow-steps/checkout/main.yaml
    workers: false
    timeout-minutes: 5
    steps:
      - name: Summarize the jobs
        id: report
        uses: file:///.nx/pipelines/steps/report/step.yaml
        with:
          title: ${{ format('CI lab on {0}', nxcloud.ref_name) }}
          results: ${{ toJSON(needs) }}

      - name: Show the expression context
        run: |
          echo "pull request:     ${{ startsWith(nxcloud.ref, 'refs/pull/') }}"
          echo "repo ends in -cc: ${{ endsWith(nxcloud.repository, '-cc') }}"
          echo "jobs:             ${{ join(fromJSON('["lint", "main", "e2e", "gateway-smoke", "cli-smoke"]'), ', ') }}"
          echo "runner:           ${{ runner.os }}/${{ runner.arch }} on ${{ runner.name }}"
          echo "failed jobs:      ${{ steps.report.outputs.failed }}"

      - name: Only outside forks
        if: ${{ !nxcloud.is_fork }}
        run: echo "not a fork, so stored secrets were available"

      - name: Fail when a job failed
        if: contains(needs.*.result, 'failure')
        run: exit 1

      - name: Only after a failure
        if: failure()
        run: echo "a job or an earlier step failed"

      - name: Only when everything passed
        if: success()
        run: echo "every job passed"
