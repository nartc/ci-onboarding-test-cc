# The smallest custom step: node, main only, no inputs. Used by the probe jobs in ci.yaml
# and the lab-probe launch template, to find out why file:// steps never get a machine.
name: 'Lab hello'
description: 'Prints one line.'
# Script paths are from the repo root, as in nrwl/nx-cloud-workflows. With ./main.js (relative to
# this file, as the custom-steps docs describe) every job using the step was killed before it
# got a machine (RECONCILIATION_FAILED_WORKFLOW).
definition:
  using: 'node'
  main: '.nx/pipelines/steps/hello/main.js'
